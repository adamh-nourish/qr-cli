name: Fuzz (nightly)

# cargo-fuzz targets in fuzz/ (DECISIONS section 7): nightly and
# non-blocking. Nothing here is a required check; a crash fails this run and
# uploads the reproducer. proptest covers the same code on every PR.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "600"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [payload, svg, encode_roundtrip, image_loader, decode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs nightly for -Zsanitizer; the shipped code is built
      # with the pinned stable toolchain elsewhere.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master (2026-11-15)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # The corpus carries over between nights so coverage keeps growing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          if [[ ! $SECONDS_PER_TARGET =~ ^[0-9]+$ ]]; then
            echo "::error::seconds must be a whole number"
            exit 1
          fi
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=8192 -timeout=30
      # cargo fuzz has no --locked, so catch a silent re-resolution here.
      - name: Check fuzz/Cargo.lock is unchanged
        run: git diff --exit-code fuzz/Cargo.lock
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
