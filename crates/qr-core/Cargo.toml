[package]
name = "qr-core"
description = "Pure QR code encoding and rendering library used by the qr CLI (no I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fast_qr.workspace = true
thiserror.workspace = true
# Raster output (DECISIONS section 1): 1-bit/indexed or RGBA PNG, baseline
# JPEG and, through `image` with only its WebP codec, lossless WebP.
png.workspace = true
jpeg-encoder.workspace = true
# Decoding our own PNG, JPEG and WebP output for --verify, which reads it
# back with rqrr.
image = { workspace = true, features = ["png", "jpeg", "webp"] }
rqrr.workspace = true

[dev-dependencies]
divan.workspace = true
proptest.workspace = true
insta.workspace = true
# Reference encoder for differential tests and the capacity-table cross-check.
qrcode.workspace = true
# Parses every generated SVG in the output-safety tests.
roxmltree.workspace = true

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "render"
harness = false
