[package]
name = "qr-cli"
description = "A fast, secure, portable QR code generator CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords = ["qr", "qrcode", "cli", "barcode"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "qr"
path = "src/main.rs"

[dependencies]
qr-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
anstyle.workspace = true
terminal_size.workspace = true
thiserror.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
# `qr batch` only: the one-shot path never starts a thread pool.
rayon.workspace = true
csv.workspace = true
# Counts each CSV row's cells before any row is parsed (DECISIONS 4.7).
csv-core.workspace = true
# NFC, so batch names that one file system stores as the same file clash.
unicode-normalization.workspace = true

# O_NONBLOCK, so opening an image or logo path never blocks on a FIFO.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true
rqrr.workspace = true
roxmltree.workspace = true
# Decodes PNG, JPEG and WebP output for the rqrr round-trip tests.
image = { workspace = true, features = ["png", "jpeg", "webp"] }

[lints]
workspace = true
