[workspace]
resolver = "3"
members = ["crates/qr-core", "crates/qr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamh-nourish/qr-cli"
publish = false

[workspace.dependencies]
qr-core = { path = "crates/qr-core", version = "0.1.0" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = "4.5"
clap_mangen = "0.3"
anstyle = "1"
terminal_size = "0.4"
thiserror = "2"
fast_qr = { version = "0.14", default-features = false }
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.9", default-features = false }
proptest = "1"
divan = "0.1.21"
assert_cmd = "2"
predicates = "3"
insta = { version = "1", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Pedantic subset: enable the group, then opt out of the noisiest lints.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Panics are bugs. Tests are exempted through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
